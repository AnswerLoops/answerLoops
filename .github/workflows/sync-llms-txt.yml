name: Sync llms.txt

# The narrative in public/llms.txt is hand-written, but its public-page and
# integration link sections are derived from the sitemap and integration index.
# After a change lands on main, keep those generated sections current with a
# small follow-up commit. The CI freshness check catches the same drift before
# a pull request can merge.
on:
  push:
    branches: [main]
    paths:
      - app/sitemap.ts
      - content/docs/integrations/meta.json
      - public/llms.txt
      - scripts/sync-llms-txt.mjs

concurrency:
  group: sync-llms-txt
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    name: Synchronize generated llms.txt links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22

      - run: node scripts/sync-llms-txt.mjs

      - name: Commit synchronized links
        run: |
          if git diff --quiet -- public/llms.txt; then
            echo "public/llms.txt is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/llms.txt
          git commit -m "docs: sync llms.txt generated links" -m "Keep the machine-readable summary aligned with the public sitemap and supported integrations so crawlers do not receive stale links."
          git push
