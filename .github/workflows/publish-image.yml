name: Publish Image

# Publishes the container image to GHCR so self-hosting does not require a local
# build. One image serves both services: app and bot run the same `runner` stage
# and differ only in their command, which is why nothing here builds twice.
#
# Built natively on both architectures rather than emulated. A Next.js build
# under QEMU takes tens of minutes and regularly outlasts anyone's patience;
# GitHub's arm64 runners are free for public repositories, so each architecture
# builds on its own hardware and a final job stitches them into one manifest.

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Lowercased, not ${{ github.repository }} directly. This repository's name is
  # mixed case (AnswerLoops/answerLoops) and container registries only accept
  # lowercase references, so the raw value is rejected by buildx before it even
  # reaches the registry. Hardcoded rather than lowercased at runtime so the
  # value is visible here and identical in every job that builds a tag from it.
  IMAGE_NAME: answerloops/answerloops

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built and loaded locally first so it can be scanned before anything
      # reaches the registry. A published layer cannot be unpublished: deleting
      # a tag leaves the digest pullable, and a credential in a layer survives
      # being deleted in a later one. The push below is a cache hit, so this
      # costs a scan rather than a second build.
      - name: Build for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runner
          platforms: ${{ matrix.platform }}
          load: true
          tags: scan-candidate:${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      # Unfiltered by severity, unlike the dependency scan: a credential in an
      # image is not less serious for carrying a lower rule severity, and this
      # is the last point at which it can still be caught.
      - name: Refuse to publish an image containing secrets
        uses: aquasecurity/trivy-action@df678dbccf677bc6937338d569ba0da18964a8cc # master 2026-07-01
        with:
          scan-type: image
          image-ref: scan-candidate:${{ matrix.suffix }}
          scanners: secret
          format: table
          exit-code: '1'

      # Scoped to /app — the application and its dependencies, which are what
      # this repository chooses and can act on. The Node base image also ships
      # npm and pnpm under /usr/local/lib/node_modules; those are upstream's to
      # version, this repository cannot patch them from a lockfile, and a gate
      # that blocks every deploy on something the deploy cannot fix stops being
      # a gate and starts being an outage. They are tracked separately and
      # addressed by removing that tooling from the runtime stage, which is the
      # actual fix rather than a suppression.
      #
      # The secret scan above is deliberately NOT scoped: it stays whole-image.
      - name: Refuse to publish known-vulnerable dependencies
        uses: aquasecurity/trivy-action@df678dbccf677bc6937338d569ba0da18964a8cc # master 2026-07-01
        with:
          scan-type: image
          image-ref: scan-candidate:${{ matrix.suffix }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: /usr/local/lib/node_modules
          format: table
          exit-code: '1'

      # Pushed by digest rather than tag: the tags belong on the manifest that
      # merges both architectures, not on either half of it.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runner
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      # Passed through env rather than interpolated into the script: the shell
      # does the prefix strip, and workflow expressions never reach the command.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Publish manifest
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` currently tracks the tip of main, because no release has ever
      # been cut and the tag therefore did not exist at all — while
      # docker-compose.ghcr.yml defaults to exactly that tag, so the documented
      # self-hosting command pointed at nothing. Tracking main is the lesser
      # problem: it resolves to something recent instead of to nothing.
      #
      # Restore `enable=${{ github.event_name == 'release' }}` when the first
      # release is cut. Leaving it on main after that point means a merge
      # landing after a release silently drags `latest` off it, and someone
      # running `latest` receives unreleased code without having asked for it.
      # Tracked as Roadmap Known Issues and GitHub issue #49.
      #
      # `{{major}}` stays out while versioning is undecided: on a 0.x line it
      # publishes a bare `0` that moves across breaking changes, which is the
      # one tag nobody should pin to.
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=long

      - name: Create and push the manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Show what was published
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.meta.outputs.version }}
