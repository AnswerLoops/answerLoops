<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="title desc">
  <title id="title">AnswerLoops — support that lives in your community</title>
  <desc id="desc">A white and charcoal AnswerLoops banner showing community channels flowing into grounded support, confidence review, and human escalation.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60a5fa"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <radialGradient id="wash" cx="50%" cy="0%" r="72%"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#111827" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1400" height="640" rx="28" fill="#fff"/>
  <rect width="1400" height="640" rx="28" fill="url(#wash)"/>
  <rect x="1" y="1" width="1398" height="638" rx="27" fill="none" stroke="#dedede"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(64 48)">
      <path d="M7 24C12 6 23 5 26 19c2 12-2 25-10 25-9 0-10-14-1-18 10-5 29 1 26 12" fill="none" stroke="url(#blue)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="20" cy="32" r="2.7" fill="#06b6d4"/>
      <text x="55" y="35" fill="#171717" font-size="27" font-weight="650" letter-spacing="-.6">answer<tspan fill="#3b82f6">Loops</tspan></text>
    </g>
    <rect x="1114" y="51" width="222" height="34" rx="17" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="1137" cy="68" r="4" fill="#2563eb"/><text x="1152" y="73" fill="#1d4ed8" font-size="11" font-weight="700" letter-spacing="1.1">OPEN SOURCE · AGPL</text>
    <text x="64" y="151" fill="#2563eb" font-size="13" font-weight="700" letter-spacing="2.3">AI SUPPORT FOR COMMUNITY-LED TEAMS</text>
    <text x="64" y="214" fill="#171717" font-size="57" font-weight="720" letter-spacing="-2.8">Support that lives</text>
    <text x="64" y="277" fill="url(#headline)" font-size="57" font-weight="720" letter-spacing="-2.8">in your community.</text>
    <text x="66" y="322" fill="#686868" font-size="17">Grounded answers. Independent review. Human escalation.</text>
    <g transform="translate(64 374)" filter="url(#shadow)">
      <rect width="1272" height="202" rx="20" fill="#252525"/>
      <text x="28" y="38" fill="#93c5fd" font-size="11" font-weight="700" letter-spacing="1.6">ONE PIPELINE · MANY CHANNELS</text>
      <text x="28" y="68" fill="#f8fafc" font-size="18" font-weight="650">The same knowledge layer powers every answer.</text>
      <g font-size="12" font-weight="600">
        <rect x="28" y="94" width="123" height="39" rx="10" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".12"/><text x="48" y="119" fill="#f3f4f6">Discord</text><circle cx="132" cy="113" r="6" fill="#60a5fa"/>
        <rect x="163" y="94" width="112" height="39" rx="10" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".12"/><text x="183" y="119" fill="#f3f4f6">Slack</text><circle cx="247" cy="113" r="6" fill="#60a5fa"/>
        <rect x="287" y="94" width="121" height="39" rx="10" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".12"/><text x="307" y="119" fill="#f3f4f6">GitHub</text><circle cx="380" cy="113" r="6" fill="#60a5fa"/>
        <rect x="420" y="94" width="174" height="39" rx="10" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".12"/><text x="440" y="119" fill="#f3f4f6">Forums · email · web</text><circle cx="566" cy="113" r="6" fill="#60a5fa"/>
      </g>
      <path d="M630 113H697" stroke="url(#blue)" stroke-width="2"/><path d="m690 106 10 7-10 7" fill="none" stroke="#67e8f9" stroke-width="2"/>
      <rect x="730" y="87" width="186" height="70" rx="13" fill="#fff" fill-opacity=".09" stroke="#93c5fd" stroke-opacity=".28"/>
      <text x="750" y="115" fill="#bfdbfe" font-size="10" font-weight="700" letter-spacing="1.3">CONFIDENCE GATE</text><text x="750" y="140" fill="#fff" font-size="16" font-weight="650">Post or review</text>
      <path d="M947 113H1009" stroke="url(#blue)" stroke-width="2"/><path d="m1002 106 10 7-10 7" fill="none" stroke="#67e8f9" stroke-width="2"/>
      <rect x="1042" y="87" width="202" height="70" rx="13" fill="#fff" fill-opacity=".09" stroke="#93c5fd" stroke-opacity=".28"/>
      <text x="1062" y="115" fill="#bfdbfe" font-size="10" font-weight="700" letter-spacing="1.3">RESOLUTION</text><text x="1062" y="140" fill="#fff" font-size="16" font-weight="650">Knowledge compounds</text>
      <path d="M1140 171C1000 194 760 194 592 162" fill="none" stroke="#60a5fa" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="5 6"/><path d="m599 157-10 5 10 5" fill="none" stroke="#60a5fa" stroke-opacity=".7" stroke-width="1.5"/>
      <text x="866" y="187" fill="#bfdbfe" font-size="11" text-anchor="middle">resolved answers improve the next response</text>
    </g>
  </g>
</svg>
